      <div class="field"><label>Full name</label><input id="t-name"></div>
      <div class="field"><label>Email ID</label><input id="t-username" placeholder="e.g. rep@patilgroup.com"></div>
      <div class="field"><label>Password</label><input id="t-password" placeholder="temporary password"></div>
    </div>
    <div class="modal-actions" style="border:none;padding-top:6px;"><button class="btn btn-primary" onclick="addRep()">Add rep</button></div>
  </div>
  <div class="card" style="margin-bottom:20px;">
    <div class="section-title"><div><h2>Team members</h2><p>Reset a rep's password to a temporary one — they'll be asked to set their own on next sign-in.</p></div></div>
    <div class="table-wrap" data-rkey="team-logins"><table>
      <tr><th>Name</th><th>Username / Email</th><th>Role</th><th>Password Status</th><th></th></tr>
      ${state.users.map(u=>`<tr>
        <td style="font-weight:600;">${esc(u.name)}</td>
        <td>${esc(u.username)}</td>
        <td>${esc(u.roleTitle || (u.role==='ceo'?'CEO / Manager':'Sales rep'))}</td>
        <td>${u.role==='ceo' ? '' : (u.mustChangePassword !== false ? 'Set by Admin' : 'Set by User')}</td>
        <td style="white-space:nowrap;">
          ${u.role==='rep'?`<div style="display:inline-flex;gap:12px;align-items:center;"><button class="link-btn" onclick="openChangePasswordModal('${u.username}')">Reset password</button><button class="link-btn btn-danger" onclick="removeRep('${u.username}')">Remove</button><button class="link-btn btn-danger" onclick="deleteUser('${u.username}')">Delete</button></div>`:''}
        </td></tr>`).join('')}
    </table></div>
  </div>
  <div class="card">
    <div class="section-title"><div><h2>Sample data</h2><p>This tracker was pre-loaded with sample offers so you could see the dashboards and reports working end to end.</p></div></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="forceReseed()">Reload sample data</button>
      <button class="btn btn-danger" onclick="clearSampleData()">Clear all sample data</button>
    </div>
    <p class="top-note" style="margin-top:10px;margin-bottom:0;">Reload replaces everything currently in the tracker with a fresh 100-offer demo set. Use this if the data ever looks thin or out of date.</p>
  </div>`;
}
async function clearSampleData(){
  if(!confirm('This permanently deletes every order, coordination log, and lost-order entry currently in the tracker \u2014 use this once you are ready to start logging real offers. Continue?')) return;
  state.orders = []; state.coordination = []; state.lostOrders = [];
  await Promise.all([storageSet(K_ORDERS, state.orders), storageSet(K_COORD, state.coordination), storageSet(K_LOST, state.lostOrders)]);
  render();
}
async function addRep(){
  const name = grab('t-name'), username = grab('t-username').trim(), password = grab('t-password');
  if(!name||!username||!password){ alert('Fill in all fields.'); return; }
  if(!username.toLowerCase().endsWith('@patilgroup.com')){ alert('Only Patil Group email IDs (@patilgroup.com) are allowed.'); return; }
  if(state.users.some(u=>u.username.toLowerCase()===username.toLowerCase())){ alert('That email ID is already taken.'); return; }
  state.users.push({username, password, role:'rep', name, mustChangePassword:true});
  await storageSet(K_USERS, state.users);
  render();
}
async function deleteUser(username){
  const target = state.users.find(u => u.username.toLowerCase() === username.toLowerCase());
  const displayName = target ? target.name : username;
  if(!confirm(`Delete sales rep "${displayName}" (${username})? This will permanently delete the user from CRM and Google Sheet.`)) return;
  state.users = state.users.filter(u => u.username.toLowerCase() !== username.toLowerCase());
  await storageSet(K_USERS, state.users);

  try {
    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'delete_user', key: K_USERS, username: username, value: state.users })
    }).catch(err => console.warn('Google Apps Script delete sync error:', err));
  } catch(e) {}

  render();
}
async function removeRep(username){
  await deleteUser(username);
}

/* ================= INIT ================= */
async function init(){
  try {
    const u = localStorage.getItem(K_USERS);
    const o = localStorage.getItem(K_ORDERS);
    const c = localStorage.getItem(K_COORD);
    const l = localStorage.getItem(K_LOST);
    const a = localStorage.getItem(K_ACTIVITY);
    const s = localStorage.getItem(K_SESSION);

    if (o) state.orders = JSON.parse(o);
    if (c) state.coordination = JSON.parse(c);
    if (l) state.lostOrders = JSON.parse(l);
    if (a) state.activity = JSON.parse(a);
    let localUsers = null;
    if (u) {
      try { localUsers = JSON.parse(u); } catch(e) {}
    }
    const localSession = s ? JSON.parse(s) : null;

    if (Array.isArray(localUsers)) {
      state.users = localUsers;
    } else {
      state.users = [...TARGET_ROSTER];
      storageSet(K_USERS, state.users);
    }

    if (localSession && localSession.username) {
      const activeUser = state.users.find(x => x.username.toLowerCase() === localSession.username.toLowerCase());
      if (activeUser) {
        state.currentUser = activeUser;
        if (localSession.topTab) state.topTab = localSession.topTab;
        if (localSession.activeTab) state.activeTab = localSession.activeTab;
        if (localSession.viewingAsRep !== undefined) state.viewingAsRep = localSession.viewingAsRep;
        if (localSession.dashboardSubTab) state.dashboardSubTab = localSession.dashboardSubTab;
      }
    }
  } catch(e) {
    console.error('Error loading local state:', e);
  }

  seedIfEmpty();
  state.loaded = true;
  render();

  // Non-blocking background sync with Apps Script
  backgroundRemoteSync();
}

async function backgroundRemoteSync(){
  try {
    const [u, o, c, l, a, s] = await Promise.all([
      storageGet(K_USERS),
      storageGet(K_ORDERS),
      storageGet(K_COORD),
      storageGet(K_LOST),
      storageGet(K_ACTIVITY),
      storageGet(K_SESSION)
    ]);
    if (u && Array.isArray(u)) {
      state.users = u;
      try { localStorage.setItem(K_USERS, JSON.stringify(u)); } catch(e) {}
    }
    if (o && Array.isArray(o) && o.length > 0) state.orders = o;
    if (c && Array.isArray(c)) state.coordination = c;
    if (l && Array.isArray(l)) state.lostOrders = l;
    if (a && typeof a === 'object') state.activity = a;

    if (s && s.username && !state.currentUser) {
      const activeUser = state.users.find(x => x.username.toLowerCase() === s.username.toLowerCase());
      if (activeUser) {
        state.currentUser = activeUser;
        if (s.topTab) state.topTab = s.topTab;
        if (s.activeTab) state.activeTab = s.activeTab;
        if (s.viewingAsRep !== undefined) state.viewingAsRep = s.viewingAsRep;
        if (s.dashboardSubTab) state.dashboardSubTab = s.dashboardSubTab;
      }
    }
    render();
  } catch(e) {}
}
init();
</script>
