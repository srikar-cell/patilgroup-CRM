<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sales Pipeline CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#ffffff; --card:#ffffff; --border:#e2e8f0; --border-strong:#cbd5e1;
    --text:#1e293b; --text2:#475569; --muted:#64748b;
    --accent:#79282d; --accent-bg:#fdf2f2; --accent-text:#79282d;
    --hazard:#79282d; --hazard-bg:#fdf4f0; --hazard-text:#79282d;
    --green:#2f6b47; --green-bg:#e3eee2;
    --amber:#d65b28; --amber-bg:#fdf0e9;
    --red:#a63a2f; --red-bg:#f5e2de;
    --gray:#5c6560; --gray-bg:#f8fafc;
    --font-head:'Barlow Semi Condensed',sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:var(--font-body);background:#ffffff;color:var(--text);
  }
  body::before{content:'';}
  #app{max-width:1200px;margin:0 auto;padding:0 20px 60px;}
  h1,h2,h3{font-weight:600;margin:0;font-family:var(--font-head);letter-spacing:.01em;}
  .mono{font-family:var(--font-mono);}
  a{color:var(--accent);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#ffffff;}
  .login-bg-video{display:none;}
  .login-bg-overlay{display:none;}
  .login-front{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:22px;padding:20px;width:100%;}
  .login-hero-brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;}
  .login-hero-brand img{height:46px;width:auto;}
  .login-hero-brand h2{color:#79282d;font-size:26px;letter-spacing:.03em;text-transform:uppercase;font-family:var(--font-head);}
  .login-hero-brand p{color:#64748b;font-size:12px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;margin:0;}
  .login-card{background:#ffffff;border:1px solid #e2e8f0;border-radius:10px;padding:36px 32px;width:380px;box-shadow:0 10px 30px rgba(0,0,0,.06);border-top:4px solid #79282d;}
  .login-card h1{font-size:22px;margin-bottom:4px;color:#1e293b;}
  .login-card p.sub{color:#64748b;font-size:13px;margin:0 0 24px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;color:var(--text2);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:4px;font-size:14px;background:#fff;color:var(--text);font-family:var(--font-body);}
  .field textarea{resize:vertical;min-height:60px;}
  .btn{padding:9px 16px;border-radius:6px;border:1px solid var(--border-strong);background:#fff;font-size:13px;font-weight:600;color:var(--text);font-family:var(--font-body);transition:all .15s ease;}
  .btn:hover{background:#f8fafc;}
  .btn-primary{background:#79282d;border-color:#79282d;color:#fff;}
  .btn-primary:hover{background:#5c1d21;}
  .btn-danger{color:var(--red);}
  .btn-block{width:100%;}
  .login-error{background:var(--red-bg);color:var(--red);font-size:13px;padding:8px 10px;border-radius:4px;margin-bottom:14px;}
  .role-toggle{display:flex;gap:0;margin-bottom:20px;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden;}
  .role-toggle button{flex:1;padding:9px 0;border:none;background:#fff;font-size:13px;font-weight:600;color:var(--text2);font-family:var(--font-head);letter-spacing:.02em;border-right:1px solid var(--border-strong);}
  .role-toggle button:last-child{border-right:none;}
  .role-toggle button.active{background:var(--accent);color:#fff;}
  .new-user-btn{margin-top:10px;}
  .login-divider{display:flex;align-items:center;gap:10px;margin:16px 0 4px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-family:var(--font-mono);}
  .login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border);}
  .demo-box{margin-top:20px;padding:12px;background:var(--gray-bg);border-radius:6px;font-size:11.5px;color:var(--text2);line-height:1.6;font-family:var(--font-mono);}
  .demo-box b{color:var(--text);font-family:var(--font-body);}

  /* ---------- Shell ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;margin:0 -20px 16px;background:#79282d;border-bottom:3px solid #d65b28;border-radius:0 0 8px 8px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .logo{width:34px;height:34px;border-radius:4px;background:#fff;padding:3px;display:flex;align-items:center;justify-content:center;}
  .brand .logo img{width:100%;height:100%;object-fit:contain;}
  .brand h1{font-size:20px;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;color:#fff;}
  .brand .tag{font-size:10.5px;color:#f8fafc;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;margin-top:1px;opacity:.9;}
  .who{display:flex;align-items:center;gap:12px;}
  .who .avatar{width:30px;height:30px;border-radius:4px;background:#d65b28;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;font-family:var(--font-mono);}
  .who .name{font-size:13px;font-weight:600;color:#fff;}
  .who .role{font-size:10.5px;color:#f8fafc;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.03em;opacity:.85;}
  .who .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff;}
  .who .btn:hover{background:rgba(255,255,255,.25);}
  .who .btn-primary{background:#d65b28;border-color:#d65b28;color:#fff;}
  .who .btn-primary:hover{background:#bd4a1c;}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto;
    background:var(--card);border:1px solid var(--border);border-radius:24px;padding:5px;box-shadow:0 1px 3px rgba(20,20,20,.05);}
  .tab{padding:9px 16px;border-radius:18px;font-size:13px;font-weight:600;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap;font-family:var(--font-head);letter-spacing:.02em;}
  .tab .sheet-no{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-right:6px;font-weight:500;}
  .tab.active{color:var(--text);border-color:transparent;background:var(--gray-bg);}
  .tab.active .sheet-no{color:var(--hazard);}
  .tab:hover{color:var(--text);}
  .tabs.sub-tabs{border-radius:2px;padding:0;background:transparent;box-shadow:none;border-bottom:1px solid var(--border-strong,#ddd);}
  .tabs.sub-tabs .tab.active{background:transparent;color:var(--hazard-text);border-bottom:2px solid var(--hazard);border-radius:0;}

  .row{display:flex;gap:16px;flex-wrap:wrap;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px 22px;box-shadow:0 2px 10px rgba(0,0,0,.03);}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px 16px;}
  .section-title>div:first-child{flex:1 1 240px;}
  .section-title h2{font-size:16px;}
  .section-title p{margin:2px 0 0;color:var(--muted);font-size:12px;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--hazard);border-radius:2px;padding:14px 16px;}
  .stat-card .label{font-size:11px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;}
  .stat-card .value{font-size:23px;font-weight:600;font-family:var(--font-mono);}
  .stat-card .sub{font-size:11.5px;color:var(--muted);margin-top:3px;font-family:var(--font-mono);}
  tr.clickable-product-row:hover{background:var(--accent-bg) !important;cursor:pointer;}

  table{width:100%;border-collapse:collapse;font-size:13px;table-layout:auto;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;border-bottom:1px solid var(--text);
     white-space:nowrap;min-width:110px;
     position:sticky;top:0;z-index:10;background:var(--card);box-shadow:0 1px 0 var(--text);}
  td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;white-space:normal;word-wrap:break-word;overflow-wrap:break-word;min-width:110px;max-width:280px;}
  tr.clickable:hover{background:var(--accent-bg);cursor:pointer;}
  .num-cell{text-align:center;}
  table tr:nth-child(even){background:rgba(27,58,107,.025);}
  .table-wrap{overflow:auto;max-height:calc(100vh - 250px);border:1px solid var(--border);border-radius:2px;}
  .table-wrap table{min-width:100%;}
  td.mono, .mono-cell{font-family:var(--font-mono);font-size:12.5px;}

  /* ---------- Column resize handles (Excel-like drag-to-resize on th) ---------- */
  .resizer{position:absolute;top:0;right:0;width:6px;height:100%;cursor:col-resize;user-select:none;touch-action:none;z-index:11;}
  .resizer:hover, .resizer.resizing{background:var(--accent);opacity:.45;}

  .badge{display:inline-block;padding:3px 9px;border-radius:3px;font-size:10.5px;font-weight:600;white-space:nowrap;text-transform:uppercase;letter-spacing:.02em;}
  .badge-hot{background:var(--red-bg);color:var(--red);}
  .badge-warm{background:var(--amber-bg);color:var(--amber);}
  .badge-cold{background:var(--accent-bg);color:var(--accent-text);}
  .badge-won{background:var(--green-bg);color:var(--green);}
  .badge-lost{background:var(--gray-bg);color:var(--gray);}
  .badge-stage{background:var(--gray-bg);color:var(--text2);}
  .badge-overdue{background:var(--red-bg);color:var(--red);font-family:var(--font-mono);}
  .status-delay{background:var(--red-bg);color:var(--red);font-weight:700;}
  .status-ontime{background:var(--green-bg);color:var(--green);font-weight:700;}
  .status-early{background:var(--accent-bg);color:var(--accent-text);font-weight:700;}
  .status-pill{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;}

  /* Signature: stage rail, a station-line for the 5 open stages, terminal flag for won/lost */
  .stage-wrap{display:flex;align-items:center;gap:8px;}
  .stage-rail{display:inline-flex;align-items:center;}
  .rail-dot{width:7px;height:7px;border-radius:50%;background:var(--border-strong);border:1px solid var(--border-strong);flex:none;}
  .rail-dot.filled{background:var(--accent);border-color:var(--accent);}
  .rail-dot.current{width:9px;height:9px;background:var(--hazard);border-color:var(--hazard);box-shadow:0 0 0 3px var(--hazard-bg);}
  .rail-seg{width:12px;height:2px;background:var(--border-strong);flex:none;}
  .rail-seg.filled{background:var(--accent);}
  .stage-rail-label{font-size:12px;color:var(--text2);}
  .stage-term{font-family:var(--font-mono);font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:3px;letter-spacing:.03em;}
  .stage-term-won{background:var(--green-bg);color:var(--green);}
  .stage-term-lost{background:var(--gray-bg);color:var(--gray);}

  /* Signal chip for priority: Hot/Warm/Cold */
  .signal-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .signal-dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .sig-red .signal-dot{background:var(--red);} .sig-red{color:var(--red);}
  .sig-amber .signal-dot{background:var(--amber);} .sig-amber{color:var(--amber);}
  .sig-blue .signal-dot{background:var(--accent);} .sig-blue{color:var(--accent-text);}

  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13px;}
  .update-meta{font-size:10.5px;color:var(--muted);margin-top:3px;font-family:var(--font-mono);}

  .modal-bg{position:fixed;inset:0;background:rgba(20,25,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;}
  .modal{background:#fff;border-radius:2px;width:640px;max-width:100%;padding:24px 26px 26px;border-top:3px solid var(--accent);}
  .modal h2{font-size:17px;margin-bottom:2px;}
  .modal .modal-sub{color:var(--muted);font-size:12.5px;margin-bottom:18px;font-family:var(--font-mono);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}
  .close-x{position:absolute;top:0;right:0;}

  .filter-bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .filter-bar select,.filter-bar input[type=date]{padding:7px 10px;border:1px solid var(--border-strong);border-radius:4px;font-size:13px;background:#fff;}
  .pill-btn{padding:6px 12px;border-radius:3px;border:1px solid var(--border-strong);background:#fff;font-size:12px;font-weight:600;font-family:var(--font-mono);}
  .pill-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .notes-log{margin-top:10px;border-top:1px solid var(--border);padding-top:10px;}
  .note-item{background:var(--gray-bg);border-radius:3px;padding:8px 10px;font-size:12.5px;margin-bottom:6px;}
  .note-item .meta{color:var(--muted);font-size:11px;margin-bottom:3px;font-family:var(--font-mono);}

  .charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;}
  @media (max-width:700px){.charts-row{grid-template-columns:1fr;} .grid2{grid-template-columns:1fr;}}

  .link-btn{background:none;border:none;color:var(--accent);font-weight:600;font-size:12.5px;padding:0;}
  .top-note{font-size:12px;color:var(--muted);margin-top:-4px;margin-bottom:16px;}
/* Number inputs (e.g. Estimated Value) shouldn't show the browser's up/down spinner — the
   full value should be typed in manually rather than nudged one step at a time. */
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
input[type="number"]{ -moz-appearance:textfield; appearance:textfield; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================= STORAGE ================= */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwUq60-IGxKcP3bLCxgugC6JF_QYRHLBgmCRURlZ6Sua_Xf1vQhQc5MPFcshqSmUA53dQ/exec';
const K_USERS='crm:users', K_ORDERS='crm:orders', K_COORD='crm:coordination', K_LOST='crm:lostorders', K_ACTIVITY='crm:activity', K_SESSION='crm:session';

async function storageGet(key){
  let localData = null;
  try {
    const raw = localStorage.getItem(key);
    if (raw) localData = JSON.parse(raw);
  } catch(e) {}

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 1500);
    const fetchUrl = APPS_SCRIPT_URL + '?action=get&key=' + encodeURIComponent(key);
    const response = await fetch(fetchUrl, { redirect: 'follow', signal: controller.signal });
    clearTimeout(timeoutId);
    if (response.ok) {
      const result = await response.json();
      const val = (result && result.value !== undefined) ? result.value : result;
      if (val !== null && val !== undefined && val !== '') {
        const parsed = (typeof val === 'string') ? JSON.parse(val) : val;
        try { localStorage.setItem(key, JSON.stringify(parsed)); } catch(e) {}
        return parsed;
      }
    }
  } catch(e) {
    // Timeout or fetch error fallback to localData
  }

  return localData;
}

async function storageSet(key, val){
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch(e) {
    console.error('localStorage set error', key, e);
  }

  try {
    const payload = JSON.stringify({ action: 'set', key: key, value: val });
    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: payload
    }).catch(err => console.warn('Google Apps Script sync error:', err));
  } catch(e) {
    console.warn('Google Apps Script storageSet warning:', key, e);
  }
}

/* ================= STATE ================= */
let state = {
  users: [], orders: [], coordination: [], lostOrders: [], activity: {},
  currentUser: null,
  loaded:false,
  topTab:'mypage',
  activeTab:'dashboard',
  statsRange:'week',
  statsDate: new Date().toISOString().slice(0,10),
  modal:null, // {type:'order'|'coord'|'lost', data:{...}}
  loginError:'',
  authView:'login', // 'login' | 'signup'
  loginMode:'user', // 'user' | 'admin' — which login tab is selected on the sign-in screen
  viewingAsRep: null, // username the CEO is currently viewing the rep-page of
  dealCycleOrderId: null,
  dealCycleActionFilter: 'all',
  dealCycleDateRange: 'all', dealCycleSearchQuery: '', dealCycleDelayTypeFilter: 'all',
  reportRangeMode: 'weekly', reportRangeFrom: null, reportRangeTo: null,
  summaryProductSort: 'value-desc'
};

const ACTIVE_WINDOW_MIN = 60; // a rep counts as "in field" if seen within this many minutes

const STAGES = [
  "1. Customer Enquiry / Lead",
  "2. Customer Visit / Project Understanding",
  "3. Collect Drawings + BOQ + Specification + Schedule",
  "4. Drawing Read and Quantity Take Off",
  "5. Final Technical + Commercial Check",
  "6. Quotation Release to Customer",
  "7. Customer Follow Up / Negotiation",
  "8. Order Confirmation / PO",
  "9. Closed Won",
  "10. Closed Lost"
];
const OPEN_STAGES = STAGES.slice(0,8);
const PROJECT_TYPES_HIERARCHY = {
  "Railway": ["Railways", "Metro", "High Speed Rail"],
  "NHAI / SH": ["Elevated Corridors", "Bridges", "Roads"],
  "Airport": [],
  "Warehousing": [],
  "Data Centre": [],
  "Public Building": [],
  "Stadium (Sports)": [],
  "Industrial (Factories)": [],
  "Multilevel Car Parking": [],
  "Others": []
};
const PROJECT_TYPES = Object.keys(PROJECT_TYPES_HIERARCHY);
const LEAD_SOURCES = {
  "Inbound": ["Cold Calling", "Website", "LinkedIn", "Existing Customer", "Others"],
  "Outbound": ["Physical Visit / Scouting", "Biltrax", "Event", "Others"]
};
const LEAD_SOURCE = Object.keys(LEAD_SOURCES);
/* PHYSICAL_VISIT_TREE — the drill-down shown when Lead source name = "Physical Visit / Scouting". */
const PHYSICAL_VISIT_TREE = {
  "EPCs": {
    "Infrastructure (Elevated Corridors, Bridges)": {},
    "Metro/High speed rail (HSR)": {},
    "Data Centre": {},
    "Highway (NH/SH)": {},
    "Real Estate": {}
  },
  "PMCs": {
    "Infrastructure": {},
    "Industrial": {},
    "Structural": {}
  },
  "DPR Consultants": {},
  "EIA Consultants": {},
  "Cost Consultants": {},
  "Wind Energy Consultants/clients": {}
};
const PRODUCTS_HIERARCHY = {
  "UHPC": ["U Girder", "I Girder", "Segmental Box Girder", "Struted Box Girder", "Deck Slabs / Overlays", "Tunnel Segment (Metro/Roads)"],
  "Building Product (Precast)": ["Columns", "Beams", "Slabs", "Load Bearing Walls", "Staircase", "Boundary Elements", "Facade Walls"],
  "Utility": ["Box Culvert", "U Drain / Trenches / Covers", "Noise Barriers", "Retaining Walls", "Boundary Walls & Cattle Fencing", "Manual Chambers / Jersey Barriers"],
  "Wind Turbine Towers": [],
  "Others": []
};
const PRODUCTS = Object.keys(PRODUCTS_HIERARCHY);

const PRIORITIES = ["Hot","Warm","Cold"];
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtCr(v){ v = Number(v)||0; return '₹'+v.toFixed(2)+' CR'; }
function isOverdue(d){ if(!d) return false; return new Date(d) < new Date(new Date().toDateString()); }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function daysBetween(a,b){ const d1=new Date(a), d2=new Date(b); if(isNaN(d1)||isNaN(d2)) return 0; return Math.round((d2-d1)/86400000); }

/* Compares an order's old stage/action/follow-up values against newly submitted ones and
   returns the auto-tracked timestamp + history fields (used by both the full edit form and the
   quick-update form so behavior is identical everywhere). Dates are derived automatically.
   newActionType ('Internal'/'External') tags the NEW action being created (who owns it \u2014
   company or client); actionDelayReason (text) explains why the OLD action ran long, if it did;
   followUpDelayReason (text) explains an overdue follow-up. All three are supplied by the sales
   rep only when required, enforced by the caller before this is invoked. */
function computeTrackingUpdates(oldOrder, newStage, newNextAction, newFollowUpDate, newActionType, actionDelayReason, actionDelayType, followUpDelayReason, actionRemarks, actionStartDate, actionEndDate, actionActualStartDate, forceActionClose){
  const today = todayStr();

  let stageHistory = (oldOrder.stageHistory||[]).slice();
  const stageChanged = (oldOrder.dealStage||'') !== (newStage||'');
  if(!stageHistory.length && oldOrder.dealStage){
    stageHistory.push({stage: oldOrder.dealStage, startDate: oldOrder.stageChangedDate || oldOrder.dateLogged || today, endDate: null});
  }
  if(stageChanged){
    if(stageHistory.length && !stageHistory[stageHistory.length-1].endDate){
      stageHistory[stageHistory.length-1] = {...stageHistory[stageHistory.length-1], endDate: today};
    }
    if(newStage) stageHistory.push({stage: newStage, startDate: today, endDate: null});
  }
  const stageChangedDate = stageChanged ? today : (oldOrder.stageChangedDate||'');

  let actionHistory = (oldOrder.actionHistory||[]).slice();
  let nextActionChangedDate = oldOrder.nextActionChangedDate || '';
  const actionChanged = (oldOrder.nextAction||'') !== (newNextAction||'');
  // forceActionClose is true whenever the sales rep went through the "Update Action (Delayed)"
  // gate (reason/type/actual-start-date/remarks) \u2014 that gate is itself the rep declaring the
  // OLD action done, so it must close out here even if the new Next Follow up Action text happens
  // to read the same as the old one (e.g. still "Confirm PO terms", just restarting the clock).
  if(actionChanged || forceActionClose){
    if(actionHistory.length && !actionHistory[actionHistory.length-1].endDate){
      // Actual end date is always "today" — the date this update is being made, captured automatically.
      // Actual start date is whatever the sales rep confirms they actually started work (not the date
      // the action was merely logged), so Actual Total Days reflects real elapsed working time.
      actionHistory[actionHistory.length-1] = {...actionHistory[actionHistory.length-1], setDate: actionActualStartDate || actionHistory[actionHistory.length-1].setDate, endDate: today, delayReason: actionDelayReason||'', delayType: actionDelayType||'', remarks: actionRemarks||''};
    } else if(oldOrder.nextAction){
      actionHistory.push({text: oldOrder.nextAction, setDate: actionActualStartDate || nextActionChangedDate || oldOrder.dateLogged || today, endDate: today, actionType:'', delayReason: actionDelayReason||'', delayType: actionDelayType||'', remarks: actionRemarks||'', plannedStart: oldOrder.actionStartDate||'', plannedEnd: oldOrder.actionEndDate||''});
    }
    if(newNextAction){
      actionHistory.push({text: newNextAction, setDate: today, endDate: null, actionType: newActionType||'', delayReason:'', remarks:'', plannedStart: actionStartDate||'', plannedEnd: actionEndDate||''});
    }
    nextActionChangedDate = today;
  } else if(actionHistory.length && !actionHistory[actionHistory.length-1].endDate) {
    if(newActionType) actionHistory[actionHistory.length-1] = {...actionHistory[actionHistory.length-1], actionType: newActionType};
    if(actionStartDate) actionHistory[actionHistory.length-1] = {...actionHistory[actionHistory.length-1], plannedStart: actionStartDate};
    if(actionEndDate) actionHistory[actionHistory.length-1] = {...actionHistory[actionHistory.length-1], plannedEnd: actionEndDate};
  }

  let followUpHistory = (oldOrder.followUpHistory||[]).slice();
  const followUpChanged = (oldOrder.followUpDate||'') !== (newFollowUpDate||'');
  if(followUpChanged && oldOrder.followUpDate){
    followUpHistory.push({
      label: oldOrder.nextAction || fmtDate(oldOrder.followUpDate),
      targetDate: oldOrder.followUpDate,
      doneDate: today,
      delayReason: followUpDelayReason||'',
      actionKey: oldOrder.nextActionChangedDate || oldOrder.dateLogged || today
    });
  }

  return {stageChangedDate, stageHistory, actionHistory, nextActionChangedDate, followUpHistory};
}

/* Worst (longest) completed action dwell-time for an order \u2014 flags the step that took longest to move past. */
function computeDelayedAction(order){
  const hist = (order.actionHistory||[]).filter(h=>h.endDate && h.setDate);
  let worst = null;
  hist.forEach(h=>{
    const days = daysBetween(h.setDate, h.endDate);
    if(days>0 && (!worst || days>worst.days)) worst = {text:h.text, days, actionType:h.actionType||'', delayReason:h.delayReason||'', delayType:h.delayType||''};
  });
  return worst;
}
/* Worst (latest) follow-up completion relative to its original target date. */
function computeDelayedFollowUp(order){
  const hist = (order.followUpHistory||[]).filter(h=>h.doneDate && h.targetDate);
  let worst = null;
  hist.forEach(h=>{
    const days = daysBetween(h.targetDate, h.doneDate);
    if(days>0 && (!worst || days>worst.days)) worst = {label:h.label||fmtDate(h.targetDate), days, delayReason:h.delayReason||''};
  });
  return worst;
}
/* Most recently CLOSED action (not the worst one \u2014 the latest one), for the simplified
   Your Orders / All Orders view. */
function lastFollowUp(order){
  const hist = (order.actionHistory||[]).filter(h=>h.endDate && h.setDate);
  if(!hist.length) return null;
  const sorted = hist.slice().sort((a,b)=>(a.endDate||'').localeCompare(b.endDate||''));
  const h = sorted[sorted.length-1];
  const days = Math.max(0, daysBetween(h.setDate, h.endDate));
  return {label: h.text||'—', days, reason: h.delayReason||'', delayType: h.delayType||'', actionType: h.actionType||'', onTime: days<=0};
}
/* How many follow-up cycles happened while a given action entry was the active next-action,
   and how many of those were on time vs delayed \u2014 used on the Deal cycle page. */
function followUpStatsForAction(order, actionEntry){
  const key = actionEntry.setDate;
  const list = (order.followUpHistory||[]).filter(f=>f.actionKey===key);
  const delayed = list.filter(f=>daysBetween(f.targetDate,f.doneDate)>0).length;
  return {total: list.length, onTime: list.length-delayed, delayed};
}
/* The follow-up target date that was originally set for a given action \u2014 used as its "planned"
   completion date on the Deal cycle page (earliest follow-up cycle logged against that action). */
function plannedEndForAction(order, actionEntry){
  const list = (order.followUpHistory||[]).filter(f=>f.actionKey===actionEntry.setDate);
  if(!list.length) return null;
  const sorted = list.slice().sort((a,b)=>(a.targetDate||'').localeCompare(b.targetDate||''));
  return sorted[0].targetDate;
}
/* Delay / On time / Early classification for a completed action. atd here is Actual Total Days =
   Actual End Date − Planned End Date (see actionAtd below) — a positive atd IS the delay in days
   (e.g. finished 3 days after the planned end date), negative means it finished early, zero means
   on time. This replaces the old duration-vs-duration comparison (actual-start-to-actual-end vs
   planned-start-to-planned-end), which could call an action "Early" even when it actually finished
   well past its planned end date, as long as it also started late and took a short duration. */
function actionStatus(atd){
  if(atd===null || atd===undefined || isNaN(atd)) return null;
  if(atd>0) return 'Delay';
  if(atd<0) return 'Early';
  return 'On time';
}
/* Actual Total Days (ATD) for a completed/ongoing action = Actual End Date − Planned End Date.
   Positive = finished that many days late, negative = that many days early, 0 = on time. Returns
   null when there's no planned end date to compare against. */
function actionAtd(plannedEnd, actualEnd){
  if(!plannedEnd || !actualEnd) return null;
  return daysBetween(plannedEnd, actualEnd);
}
/* Total deal cycle time \u2014 date logged to closed date, or to today if still open. */
function totalCycleDays(order){
  const end = order.closedDate || todayStr();
  return daysBetween(order.dateLogged, end);
}

/* Is the order currently sitting on an action/follow-up that, if closed out right now, would
   count as delayed \u2014 used to decide whether the rep must be prompted for a reason/type. */
function pendingActionDelayDays(order){
  const start = order.nextActionChangedDate || order.dateLogged;
  if(!start || !order.nextAction) return 0;
  // Delay must be judged against BOTH the planned action end date and the follow-up date —
  // whichever is further overdue — not just one with the other ignored. Previously this checked
  // actionEndDate first and only fell back to followUpDate when actionEndDate was blank, so a
  // future/blank actionEndDate could mask an already-overdue followUpDate, silently skipping the
  // "Update Action (Delayed)" gate and leaving the old action stuck open ("Ongoing") forever while
  // the deal stayed stuck in the Overdue tab.
  let days = 0;
  let any = false;
  if(order.actionEndDate){ days = Math.max(days, daysBetween(order.actionEndDate, todayStr())); any = true; }
  if(order.followUpDate){ days = Math.max(days, daysBetween(order.followUpDate, todayStr())); any = true; }
  if(!any) days = daysBetween(start, todayStr());
  return Math.max(0, days);
}
function pendingFollowUpDelayDays(order){
  if(!order.followUpDate) return 0;
  return Math.max(0, daysBetween(order.followUpDate, todayStr()));
}
/* The Internal/External tag already on the currently active (still-open) action, if any. */
function activeActionType(order){
  const hist = order.actionHistory||[];
  if(!hist.length) return '';
  const last = hist[hist.length-1];
  return (!last.endDate) ? (last.actionType||'') : '';
}

/* ================= FIELD ACTIVITY & LOCATION ================= */
async function pingActivity(){
  const u = state.currentUser;
  if(!u || u.role!=='rep') return;
  const existing = state.activity[u.username] || {};
  state.activity[u.username] = { ...existing, username:u.username, lastSeen: Date.now() };
  await storageSet(K_ACTIVITY, state.activity);
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const { latitude, longitude } = pos.coords;
    let label = `${latitude.toFixed(3)}, ${longitude.toFixed(3)}`;
    try{
      const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=10`);
      const json = await resp.json();
      const a = json.address || {};
      label = a.city || a.town || a.village || a.county || label;
      if(a.state) label += ', ' + a.state;
    }catch(e){ /* offline or blocked — keep coordinates as label */ }
    state.activity[u.username] = { ...state.activity[u.username], lat:latitude, lng:longitude, locationLabel:label, lastSeen: Date.now() };
    await storageSet(K_ACTIVITY, state.activity);
    if(state.currentUser && state.currentUser.username===u.username) render();
  }, ()=>{ /* permission denied or unavailable — location stays unset */ }, { timeout:8000, maximumAge:600000 });
}
function isRepActive(username){
  const a = state.activity[username];
  if(!a || !a.lastSeen) return false;
  return (Date.now() - a.lastSeen) < ACTIVE_WINDOW_MIN*60*1000;
}
function lastSeenLabel(username){
  const a = state.activity[username];
  if(!a || !a.lastSeen) return 'No activity yet';
  const mins = Math.round((Date.now()-a.lastSeen)/60000);
  if(mins<1) return 'Active just now';
  if(mins<60) return `Active ${mins} min ago`;
  const hrs = Math.round(mins/60);
  if(hrs<24) return `Last seen ${hrs}h ago`;
  return `Last seen ${fmtDate(new Date(a.lastSeen).toISOString().slice(0,10))}`;
}

function getOverdueLeads(orders){
  return orders
    .filter(o=>!o.dealStage.startsWith('9.') && !o.dealStage.startsWith('10.') && isOverdue(o.followUpDate))
    .sort((a,b)=>{
      const ad = a.followUpDate||'9999', bd = b.followUpDate||'9999';
      if(ad!==bd) return ad<bd?-1:1;
      const pr = {Hot:0,Warm:1,Cold:2};
      return (pr[a.priority]??3)-(pr[b.priority]??3);
    })
    .slice(0,5);
}
function getUpcomingDeadlines(orders){
  return orders
    .filter(o=>!o.dealStage.startsWith('9.') && !o.dealStage.startsWith('10.') && o.followUpDate && !isOverdue(o.followUpDate))
    .sort((a,b)=>{
      const aLeft = Math.max(0, daysBetween(todayStr(), a.followUpDate));
      const bLeft = Math.max(0, daysBetween(todayStr(), b.followUpDate));
      if(aLeft !== bLeft) return aLeft - bLeft;
      const pr = {Hot:0,Warm:1,Cold:2};
      return (pr[a.priority]??3)-(pr[b.priority]??3);
    })
    .slice(0,5);
}

}

function inRange(dateStr, range, refDate){
  if(!dateStr) return false;
  const d = new Date(dateStr);
  const ref = new Date(refDate);
  if(range==='day'){
    return d.toDateString()===ref.toDateString();
  }
  if(range==='week'){
    const start = new Date(ref); start.setDate(ref.getDate()-ref.getDay());
    const end = new Date(start); end.setDate(start.getDate()+6);
    return d>=new Date(start.toDateString()) && d<=new Date(end.toDateString()+' 23:59:59');
  }
  if(range==='month'){
    return d.getFullYear()===ref.getFullYear() && d.getMonth()===ref.getMonth();
  }
  if(range==='custom'){
    const start = new Date(state.statsDateFrom || refDate);
    const end = new Date(state.statsDateTo || refDate);
    return d>=new Date(start.toDateString()) && d<=new Date(end.toDateString()+' 23:59:59');
  }
  return true;
}

/* ================= COLUMN RESIZE (Excel-like drag-to-resize) =================
   Widths are kept in-memory only (window.__colWidths), keyed by each table's
   data-rkey plus column index, so a column you resize stays put while you switch
   tabs in this session — but resets on a full page reload (by design, not saved
   to storage). Since render() fully replaces #app's innerHTML every time, we
   re-inject the resizer handles and re-apply any saved widths after every render
   rather than trying to preserve DOM nodes across renders. */
window.__colWidths = window.__colWidths || {};
function applyColumnWidths(){
  document.querySelectorAll('.table-wrap[data-rkey]').forEach(wrap=>{
    const key = wrap.getAttribute('data-rkey');
    const table = wrap.querySelector('table');
    if(!table) return;
    const headerRow = table.querySelector('tr');
    if(!headerRow) return;
    const ths = Array.from(headerRow.children).filter(el=>el.tagName==='TH');
    const saved = window.__colWidths[key];
    ths.forEach((th, i)=>{
      if(saved && saved[i]) th.style.width = saved[i]+'px';
      if(!th.querySelector('.resizer')){
        const r = document.createElement('div');
        r.className = 'resizer';
        r.addEventListener('mousedown', e=>startColumnResize(e, th, key, i));
        th.appendChild(r);
      }
    });
  });
}
function startColumnResize(e, th, key, index){
  e.preventDefault();
  e.stopPropagation();
  const startX = e.pageX;
  const startWidth = th.getBoundingClientRect().width;
  const handle = e.target;
  handle.classList.add('resizing');
  function onMove(ev){
    const w = Math.max(50, Math.round(startWidth + (ev.pageX - startX)));
    th.style.width = w+'px';
  }
  function onUp(){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    handle.classList.remove('resizing');
    window.__colWidths[key] = window.__colWidths[key] || {};
    window.__colWidths[key][index] = th.getBoundingClientRect().width;
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function doLogin(e){

    state.loginError='Access denied. Only Patil Group email IDs (@patilgroup.com) are allowed to access this system.';
    render(); return;
  }
  const isAdminMode = (state.loginMode || 'user') === 'admin';
  if(isAdminMode){
    let user = state.users.find(x => x.username.toLowerCase() === u.toLowerCase());
    if(!user){
      const targetAdmin = TARGET_ROSTER.find(tr => tr.username.toLowerCase() === u.toLowerCase() && tr.role === 'ceo');
      if(targetAdmin){
        user = { ...targetAdmin };
        state.users.push(user);
        storageSet(K_USERS, state.users);
      }
    }
    if(!user){
      state.loginError = 'Admin account not found for that email ID.';
      render(); return;
    }
    if(user.role !== 'ceo'){
      state.loginError = 'This account is not an admin account. Switch to the User tab to sign in.';
      render(); return;
    }
    state.loginError = '';
    startSession(user);
  } else {
    const passEl = document.getElementById('login-pass');
    const p = passEl ? passEl.value : '';
    if(!p){ state.loginError = 'Please enter your password.'; render(); return; }
    const user = state.users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.password === p);
    if(!user){ state.loginError = 'Incorrect email ID or password.'; render(); return; }
    if(user.role !== 'rep'){
      state.loginError = 'This is an admin account. Switch to the Admin tab to sign in.';
      render(); return;
    }
    state.loginError = '';
    startSession(user);
  }
}

      username: state.currentUser.username,

      activeTab: state.activeTab,
      viewingAsRep: state.viewingAsRep,

    });

}

/* ================= PRODUCT NORMALIZATION & HIERARCHY ================= */
function parseProduct(p, idx = 0){
  p = (p || '').trim();
  if(!p || p === 'Others') return { cat: 'Others', sub: '' };
  if(p === 'Wind Turbine Towers') return { cat: 'Wind Turbine Towers', sub: '' };

  const legacyMap = {
    'U Drain': { cat: 'Utility', sub: 'U Drain / Trenches / Covers' },
    'Coping Slabs': { cat: 'UHPC', sub: 'Deck Slabs / Overlays' },
    'Culverts': { cat: 'Utility', sub: 'Box Culvert' },
    'Toilet Blocks': { cat: 'Building Product (Precast)', sub: 'Columns' },
    'Precast concrete units': { cat: 'Building Product (Precast)', sub: 'Slabs' }
  };
  if(legacyMap[p]) return legacyMap[p];

  if(p.includes(', ')){
    const [cat, ...rest] = p.split(', ');
    const sub = rest.join(', ').trim();
    if(PRODUCTS_HIERARCHY[cat]) return { cat, sub };
  }

  for(const cat of Object.keys(PRODUCTS_HIERARCHY)){
    if((PRODUCTS_HIERARCHY[cat] || []).includes(p)){
      return { cat, sub: p };
    }
  }

  if(PRODUCTS_HIERARCHY[p] && PRODUCTS_HIERARCHY[p].length > 0){
    const subs = PRODUCTS_HIERARCHY[p];
    const sub = subs[Math.abs(idx) % subs.length];
    return { cat: p, sub };
  }

  if(PRODUCTS_HIERARCHY[p]) return { cat: p, sub: '' };

  return { cat: 'Others', sub: p };
}

function normalizeOrderProducts(orders){
  if(!orders || !Array.isArray(orders)) return;
  orders.forEach((o, i) => {
    const norm = parseProduct(o.product, i);
    o.product = norm.sub ? `${norm.cat}, ${norm.sub}` : norm.cat;
  });
}

const GREEN_HEX = '#2f6b47';
function reps(){ return state.users.filter(x=>x.role==='rep'); }
function applyDashFilters(orders){
  const stageEl = document.getElementById('dash-stage-filter');
  const repEl = document.getElementById('dash-rep-filter');
  let out = orders.slice().sort((a,b)=> (b.dateLogged||'').localeCompare(a.dateLogged||''));
  if(stageEl && stageEl.value) out = out.filter(o=>o.dealStage===stageEl.value);
  if(repEl && repEl.value) out = out.filter(o=>o.salesPerson===repEl.value);
  if(state.dashPriorityFilter) out = out.filter(o=>o.priority===state.dashPriorityFilter);
  if(state.dashSortValue) {
    out.sort((a,b) => {
       const va = Number(a.estimatedValue) || 0;
       const vb = Number(b.estimatedValue) || 0;
       return state.dashSortValue === 'DESC' ? (vb - va) : (va - vb);
    });
  }
  return out;
}

function computeFollowUpCounts(order){
  const hist = (order.followUpHistory||[]);
  const delayed = hist.filter(f=>daysBetween(f.targetDate,f.doneDate)>0).length;
  return {total:hist.length, onTime:hist.length-delayed, delayed};
}
function buildMasterDataRows(orders){
  return orders.map(o=>{
    const lf = lastFollowUp(o);
    const da = computeDelayedAction(o);
    const df = computeDelayedFollowUp(o);
    const fc = computeFollowUpCounts(o);
    return {
      'Client': o.clientName||'',
      'Project': o.projectName||'',
      'Sales Rep': repName(o.salesPerson),
      'Lead Source': o.leadSourceType||'',
      'Lead Source Detail': leadSourceDetailLabel(o),
      'Current Stage': o.dealStage||'',
      'Priority': o.priority||'',
      'Estimated Value (Cr)': o.estimatedValue||0,
      'Date Logged': o.dateLogged||'',
      'Closed Date': o.closedDate||'',
      'Total Offer Cycle Time (days)': totalCycleDays(o),
      'Next Follow up Action': o.nextAction||'',
      'Next Follow-up Date': o.followUpDate||'',
      'Last Follow-up Name': lf?lf.label:'',
      'Last Follow-up Delay (days)': lf?(lf.onTime?0:lf.days):'',
      'Reason for Follow Delayed (last)': lf?lf.reason:'',
      'Total Follow-ups': fc.total,
      'On-time Follow-ups': fc.onTime,
      'Delayed Follow-ups': fc.delayed,
      'Worst Delayed Action': da?da.text:'',
      'Worst Delayed Action Time (days)': da?da.days:'',
      'Type of Worst Action Delay': da?da.actionType:'',
      'Reason for Worst Action Delay': da?da.delayReason:'',
      'Worst Delayed Follow-up': df?df.label:'',
      'Worst Delayed Follow-up Time (days)': df?df.days:'',
      'Reason for Worst Follow-up Delay': df?df.delayReason:'',
      'Reason for Win/Loss': o.reasonLostWon||''
    };
  });
}
async function downloadDailyReport(){
  if(typeof XLSX==='undefined'){ alert('Excel export library did not load — check your internet connection and try again.'); return; }
  const mode = state.reportRangeMode;
  let fromDate, toDate;
  const today = new Date();
  if(mode==='daily'){ fromDate=todayStr(); toDate=todayStr(); }
  else if(mode==='weekly'){ const d=new Date(today); d.setDate(d.getDate()-6); fromDate=d.toISOString().slice(0,10); toDate=todayStr(); }
  else if(mode==='monthly'){ const d=new Date(today); d.setDate(d.getDate()-29); fromDate=d.toISOString().slice(0,10); toDate=todayStr(); }
  else {
    fromDate = grab('report-range-from'); toDate = grab('report-range-to');
    if(!fromDate || !toDate){ alert('Pick both a from and to date.'); return; }
  }
  state.reportRangeFrom = fromDate; state.reportRangeTo = toDate;

  const scoped = myOrders();
  const inWindow = scoped.filter(o => (o.dateLogged||'') >= fromDate && (o.dateLogged||'') <= toDate);
  if(!inWindow.length){ alert('No offers logged in that range.'); return; }
  const rows = buildMasterDataRows(inWindow);
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = Object.keys(rows[0]).map(k=>({wch: Math.min(32, Math.max(12, k.length+2))}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Offers Master Data');
  XLSX.writeFile(wb, `Offer_Report_${fromDate}_to_${toDate}.xlsx`);
}

function buildDealCycleSheets(o){
  const overview = [{
    'Client': o.clientName||'', 'Project': o.projectName||'', 'Sales Rep': repName(o.salesPerson),
    'Product': o.product||'', 'Project Type': o.projectType||'', 'Location': o.location||'',
    'Estimated Value (Cr)': o.estimatedValue||0, 'Priority': o.priority||'',
    'Current Stage': o.dealStage||'', 'Date Logged': o.dateLogged||'', 'Closed Date': o.closedDate||'',
    'Total Offer Cycle Time (days)': totalCycleDays(o), 'Reason for Win/Loss': o.reasonLostWon||''
  }];
  const stages = (o.stageHistory||[]).map(s=>{
    const terminal = s.stage.startsWith('9.')||s.stage.startsWith('10.');
    const end = s.endDate || (terminal ? null : todayStr());
    return {
      'Sale Stage': s.stage, 'Start Date': s.startDate||'', 'End Date': terminal?'':(s.endDate||'Ongoing'),
      'Total Time (days)': end ? daysBetween(s.startDate, end) : ''
    };
  });
  const actions = (o.actionHistory||[]).map(a=>{
    const plannedEnd = a.plannedEnd || plannedEndForAction(o, a);
    const plannedStart = a.plannedStart || a.setDate;
    const ptd = plannedEnd ? daysBetween(plannedStart, plannedEnd) : null;
    const atd = a.endDate ? actionAtd(plannedEnd, a.endDate) : null; // blank while ongoing
    const status = a.endDate ? (actionStatus(atd)||'') : 'Ongoing';
    const totalDelay = (status==='Delay') ? Math.max(0, atd) : 0;
    return {
      'Next Follow up Action': a.text||'', 'Planned Start Date': plannedStart||'', 'Planned End Date': plannedEnd||'',
      'Planned Total Days (PTD)': ptd===null?'':ptd, 'Type of Action': a.actionType||'',
      'Actual Start Date': a.setDate||'', 'Actual End Date': a.endDate||'Ongoing', 'Actual Total Days (ATD)': atd===null?'':atd,
      'Status': status, 'Total Delay (days)': status==='Delay'?totalDelay:0, 'Delay Reason': a.delayReason||''
    };
  });
  return {overview, stages, actions};
}
async function downloadDealCycle(id, filterData){
  if(typeof XLSX==='undefined'){ alert('Excel export library did not load — check your internet connection and try again.'); return; }
  const o = state.orders.find(x=>x.id===id);
  if(!o) return;
  const {overview, stages, actions} = buildDealCycleSheets(o, filterData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(overview), 'Overview');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(stages.length?stages:[{'Sale Stage':'No stage history yet'}]), 'Stages');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(actions.length?actions:[{'Next Follow up Action':'No action history yet'}]), 'Actions');
  XLSX.writeFile(wb, `Offer_Cycle_${(o.clientName||'offer').replace(/[^a-z0-9]+/gi,'_')}.xlsx`);
}
function renderDealCycle(){

      const days = parseInt(state.dealCycleDateRange, 10);
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - days);
      const cutoffStr = cutoff.toISOString().slice(0,10);
      rawOrders = rawOrders.filter(o => (o.dateLogged || '') >= cutoffStr);
  }
  const orders = rawOrders.slice().sort((a,b)=>(a.clientName||'').localeCompare(b.clientName||''));
  if(!orders.length) return `<div class="card">

      </div>

  </div>`;
  let selId = state.dealCycleOrderId;
  if(!selId || !orders.find(o=>o.id===selId)) selId = orders[0].id;
  state.dealCycleOrderId = selId;
  const o = orders.find(x=>x.id===selId);
  const isClosed = o.dealStage.startsWith('9.')||o.dealStage.startsWith('10.');

  const stageRows = (o.stageHistory||[]).map(s=>{
    const terminal = s.stage.startsWith('9.')||s.stage.startsWith('10.');
    const end = s.endDate || (terminal ? null : todayStr());
    const days = end ? daysBetween(s.startDate, end) : null;
    return `<tr><td>${badgeForStage(s.stage)}</td><td>${fmtDate(s.startDate)}</td><td>${terminal?'—':(s.endDate?fmtDate(s.endDate):'<span style="color:var(--muted);">Ongoing</span>')}</td><td class="mono num-cell">${days===null?'—':days}</td></tr>`;

  // Build the full action row-set with planned vs actual + status, then apply the filter.
  let internalDelayCount=0, externalDelayCount=0;
  const allActionRows = (o.actionHistory||[]).map(a=>{
    const plannedEnd = a.plannedEnd || plannedEndForAction(o, a);
    const plannedStart = a.plannedStart || a.setDate;
    const ptd = plannedEnd ? daysBetween(plannedStart, plannedEnd) : null;
    // ATD only makes sense for a *completed* action (Actual End Date − Planned End Date) — an

    const atd = a.endDate ? actionAtd(plannedEnd, a.endDate) : null;

    return {a, plannedEnd, ptd, atd, status, totalDelay};
  });
  const filter = state.dealCycleActionFilter;
  const delayTypeFilter = state.dealCycleDelayTypeFilter || 'all';
  const filteredActionRows = allActionRows.filter(r=>{

    if(delayTypeFilter !== 'all' && r.a.delayType !== delayTypeFilter) return false;

  // Group actions by the deal stage that was active when the action was set,

  const stageGroupOrder = [];

  filteredActionRows.forEach(r=>{

  return `

          ${orders.map(x=>`<option value="${x.id}" ${x.id===selId?'selected':''}>[${x.id}] ${esc(x.clientName)}${x.projectName?' — '+esc(x.projectName):''}</option>`).join('')}
        </select>

function filterByDateRange(dateStr, filterData) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  if (isNaN(d)) return false;
  let start, end;
  if (filterData.range === '7') {
    end = new Date();
    start = new Date();
    start.setDate(end.getDate() - 7);
  } else if (filterData.range === '30') {
    end = new Date();
    start = new Date();
    start.setDate(end.getDate() - 30);
  } else {
    start = new Date(filterData.from);
    end = new Date(filterData.to);
  }
  return d >= new Date(start.toDateString()) && d <= new Date(end.toDateString() + ' 23:59:59');
}

async function submitChangePassword(){
  const d = state.modal.data;
  const user = state.users.find(u=>u.username.toLowerCase()===d.target.toLowerCase());
  if(!user){ closeModal(); return; }
  const newPw = grab('cp-new'), confirmPw = grab('cp-confirm');
  if(!d.isReset){
    const oldPw = grab('cp-old');
    if(user.password !== oldPw){ state.modal.data.error='Current password is incorrect.'; render(); return; }
  }
  if(!newPw || newPw.length<4){ state.modal.data.error='New password must be at least 4 characters.'; render(); return; }
  if(newPw !== confirmPw){ state.modal.data.error='Passwords do not match.'; render(); return; }
  user.password = newPw;
  user.mustChangePassword = !!d.isReset;
  await storageSet(K_USERS, state.users);

  try {
    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: d.isReset ? 'reset_password' : 'update_password', key: K_USERS, username: user.username, password: newPw, mustChangePassword: !!d.isReset, value: state.users })
    }).catch(err => console.warn('Google Apps Script password sync warning:', err));
  } catch(e) {}

  if(!d.isReset && state.currentUser && state.currentUser.username.toLowerCase()===user.username.toLowerCase()){
    state.currentUser.password = newPw;
    state.currentUser.mustChangePassword = false;
  }
  state.modal = null;
  render();
}

  const needsDelayClear = actionDelayDays > 0 && !state.modal.delayCleared;

  if (needsDelayClear) {
    return `

/* Live-locks the follow-up date input until the required Type-of-action / delay-reason fields
   (for the given form prefix, 'qf' or 'f') have actually been filled in \u2014 enforces "classify
   and explain first, new follow-up date second". */
function syncDelayGate(prefix){
  const dateEl = document.getElementById(prefix+'-followUpDate');
  if(!dateEl) return;
  const typeEl = document.getElementById(prefix+'-actionType');
  let locked = false;
  if(typeEl && !typeEl.value) locked = true;
  dateEl.disabled = locked;
}
async function saveQuickUpdate(id){
  const order = state.orders.find(o=>o.id===id);
  if(!order) return;
  const wasLost = order.dealStage && order.dealStage.startsWith('10.');
  const newStage = grab('qf-dealStage');
  const newNextAction = grab('qf-nextAction');
  const forceActionClose = !!state.modal.delayCleared;
  let followUpDate = grab('qf-followUpDate');
  if(!followUpDate && newNextAction && (newNextAction !== (order.nextAction||'') || forceActionClose)) followUpDate = todayStr();
  let closedDate = grab('qf-closedDate');
  if(!closedDate && (newStage.startsWith('9.')||newStage.startsWith('10.'))) closedDate = todayStr();
  const isClosingNow = newStage.startsWith('9.')||newStage.startsWith('10.');
  if(forceActionClose && !isClosingNow && followUpDate && followUpDate < todayStr()){
    alert('This action was just marked delayed and resolved — please pick a follow-up date of today or later so it doesn\'t stay stuck in Overdue.');
    return;
  }

  const newActionType = grab('qf-actionType');
  let newActionStartDate = grab('qf-actionStartDate');
  let newActionEndDate = grab('qf-actionEndDate');
  if(newNextAction && !newActionType){ alert('Please classify this Next Follow up Action as Internal or External before saving.'); return; }
  if(newNextAction && !newActionStartDate) newActionStartDate = todayStr(); // default rather than block the save

  const actionChanged = (order.nextAction||'') !== (newNextAction||'');
  let actionDelayReason = state.modal.tempDelayReason || '';
  let actionDelayType = state.modal.tempDelayType || '';
  let actionRemarks = '';
  if (actionChanged || forceActionClose) {
      actionRemarks = state.modal.tempRemarks || (document.getElementById('qf-actionRemarks') ? grab('qf-actionRemarks').trim() : '');
  }

  const actionActualStartDate = state.modal.tempActualStartDate || '';
  const tracking = computeTrackingUpdates(order, newStage, newNextAction, followUpDate, newActionType, actionDelayReason, actionDelayType, '', actionRemarks, newActionStartDate, newActionEndDate, actionActualStartDate, forceActionClose);

  order.dealStage = newStage;
  order.stageChangedDate = tracking.stageChangedDate;
  order.stageHistory = tracking.stageHistory;
  order.nextAction = newNextAction;
  if(newNextAction) {
    order.actionStartDate = newActionStartDate;
    order.actionEndDate = newActionEndDate;
  }
  order.nextActionChangedDate = tracking.nextActionChangedDate;
  order.actionHistory = tracking.actionHistory;
  order.followUpDate = followUpDate;
  order.followUpHistory = tracking.followUpHistory;
  order.reasonLostWon = grab('qf-reasonLostWon');
  order.closedDate = closedDate;

  await storageSet(K_ORDERS, state.orders);

  const nowLost = order.dealStage.startsWith('10.');
  if(nowLost && !wasLost){
    const exists = state.lostOrders.find(l=>l.clientName===order.clientName && l.linkedOrderId===order.id);
    if(!exists){
      state.lostOrders.push({
        id: uid(), linkedOrderId: order.id, dateAnalysed: todayStr(),
        clientName: order.clientName, projectName: order.projectName,
        estimatedValue: order.estimatedValue, competitorWhoWon:'', rootCause: order.reasonLostWon||'',
        improvementsRequired:'', actionOwner:'', targetDate:'', status:'Not started', notes:[]
      });
      await storageSet(K_LOST, state.lostOrders);
    }
  }
  closeModal();
}

/* Renders the Physical Visit / Scouting drill-down as a compact breadcrumb chain (">" separated
   selects) that sits right under the Lead source name field — no separate labelled cell. Each
   level's onchange truncates the path from that level down and re-renders, so changing an
   earlier level clears everything picked below it. Stops once a leaf is reached. */
function renderVisitTreeInline(path){
  let html = '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:8px;">';
  let node = PHYSICAL_VISIT_TREE;
  let level = 0;
  while(node && typeof node==='object' && Object.keys(node).length){
    const options = Object.keys(node);
    const selected = path[level] || '';
    html += `<span style="color:var(--muted);font-size:13px;">&gt;</span>
      <select onchange="updateVisitTreeLevel(${level}, this.value)" style="padding:4px 6px;font-size:12.5px;border:1px solid var(--border-strong);border-radius:4px;max-width:170px;">
        <option value="">Select...</option>
        ${options.map(o=>`<option value="${esc(o)}" ${o===selected?'selected':''}>${esc(o)}</option>`).join('')}
      </select>`;
    if(!selected) break;
    node = node[selected];
    level++;
  }
  html += '</div>';
  return html;
}
function updateVisitTreeLevel(level, value){
  const d = state.modal.data;
  d.leadSourceVisitPath = (d.leadSourceVisitPath||[]).slice(0, level);
  if(value) d.leadSourceVisitPath.push(value);
  render();
}
/* True once `path` has walked PHYSICAL_VISIT_TREE all the way down to a leaf (no more children left to pick). */
function isVisitTreeComplete(path){
  let node = PHYSICAL_VISIT_TREE;
  for(const p of (path||[])){
    if(!node[p]) return false;
    node = node[p];
  }
  return !(node && typeof node==='object' && Object.keys(node).length);
}

function grab(id){ const el=document.getElementById(id); return el?el.value:''; }
async function saveOrder(){
  const d = state.modal.data;
  const wasLost = d.dealStage && d.dealStage.startsWith('10.');
  const newStage = grab('f-dealStage');
  const newNextAction = grab('f-nextAction');
  const forceActionClose = !!state.modal.delayCleared;
  const newFollowUpDate = grab('f-followUpDate');
  let closedDate = grab('f-closedDate');
  if(!closedDate && (newStage.startsWith('9.')||newStage.startsWith('10.'))) closedDate = todayStr();
  const isClosingNow = newStage.startsWith('9.')||newStage.startsWith('10.');
  if(forceActionClose && !isClosingNow && newFollowUpDate && newFollowUpDate < todayStr()){
    alert('This action was just marked delayed and resolved — please pick a follow-up date of today or later so it doesn\'t stay stuck in Overdue.');
    return;
  }

  const newActionType = grab('f-actionType');
  let newActionStartDate = grab('f-actionStartDate');
  let newActionEndDate = grab('f-actionEndDate');
  if(newNextAction && !newActionType){ alert('Please classify this Next Follow up Action as Internal or External before saving.'); return; }
  if(newNextAction && !newActionStartDate) newActionStartDate = todayStr(); // default rather than block the save

  const actionChanged = (d.nextAction||'') !== (newNextAction||'');
  let actionDelayReason = state.modal.tempDelayReason || '';
  let actionDelayType = state.modal.tempDelayType || '';
  let actionRemarks = '';
  if (d.id && (actionChanged || forceActionClose)) {
      actionRemarks = state.modal.tempRemarks || (document.getElementById('f-actionRemarks') ? grab('f-actionRemarks').trim() : '');
  }

  const productCat = grab('f-productCategory');
  const productSub = grab('f-productSubCategory');
  const product = productSub ? `${productCat}, ${productSub}` : productCat;
  const productOtherDesc = grab('f-productOtherDesc');
  const projectCat = grab('f-projectCategory');
  const projectSub = grab('f-projectSubCategory');
  const projectType = projectSub ? `${projectCat}, ${projectSub}` : projectCat;
  const clientMobile = grab('f-clientMobile').replace(/\D/g,'');

  const required = {
    'Client name / company': grab('f-clientName'),
    'Client POC': grab('f-clientPOC'),
    'POC designation': grab('f-clientPOCDesignation'),
    'Product of interest': product,
    'Project name & description': grab('f-projectName'),
    'Location / region': grab('f-location'),
    'Next Follow up Action': newNextAction
  };
  for(const [label,val] of Object.entries(required)){
    if(!val){ alert(label+' is required.'); return; }
  }
  if(d.leadSourceName==='Others' && !grab('f-leadSourceOther').trim()){ alert('Please specify the lead source.'); return; }
  if(d.leadSourceName==='Physical Visit / Scouting' && !isVisitTreeComplete(d.leadSourceVisitPath)){ alert('Please complete the Physical Visit / Scouting selection down to the last level.'); return; }
  if(!(parseFloat(grab('f-estimatedValue'))>0)){ alert('Estimated value (Cr) is required and must be greater than 0.'); return; }
  if(clientMobile.length!==10){ alert('POC mobile must be exactly 10 digits.'); return; }
  const emailVal = grab('f-clientEmail').trim();
  if(!emailVal || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)){ alert('A valid POC email is required.'); return; }
  if(!newFollowUpDate && !isClosingNow){ alert('New follow-up date is required (unless the offer is being closed Won or Lost).'); return; }

  const actionActualStartDate = state.modal.tempActualStartDate || '';
  const tracking = computeTrackingUpdates(d, newStage, newNextAction, newFollowUpDate, newActionType, actionDelayReason, actionDelayType, '', actionRemarks, newActionStartDate, newActionEndDate, actionActualStartDate, forceActionClose);
  const updated = {
    id: d.id || uid(),
    dateLogged: grab('f-dateLogged'),
    salesPerson: document.getElementById('f-salesPerson') ? grab('f-salesPerson') : d.salesPerson,
    leadSourceType: grab('f-leadSourceType'),
    leadSourceName: grab('f-leadSourceName'),
    leadSourceOther: d.leadSourceName==='Others' ? grab('f-leadSourceOther') : '',
    leadSourceVisitPath: d.leadSourceName==='Physical Visit / Scouting' ? (d.leadSourceVisitPath||[]) : [],
    clientName: grab('f-clientName'),
    clientPOC: grab('f-clientPOC'),
    clientPOCDesignation: grab('f-clientPOCDesignation'),
    clientMobile: clientMobile,
    clientEmail: emailVal,
    product: product, productOtherDesc: productOtherDesc||'',
    projectName: grab('f-projectName'),
    projectType: projectType,
    location: grab('f-location'),
    estimatedValue: parseFloat(grab('f-estimatedValue'))||0,
    priority: grab('f-priority'),
    dealStage: newStage,
    stageChangedDate: tracking.stageChangedDate,
    stageHistory: tracking.stageHistory,
    nextAction: newNextAction,
    actionStartDate: newNextAction ? newActionStartDate : '',
    actionEndDate: newNextAction ? newActionEndDate : '',
    nextActionChangedDate: tracking.nextActionChangedDate,
    actionHistory: tracking.actionHistory,
    followUpDate: newFollowUpDate,
    followUpHistory: tracking.followUpHistory,
    reasonLostWon: grab('f-reasonLostWon'),
    closedDate: closedDate,
    updates: d.updates || []
  };
  const idx = state.orders.findIndex(o=>o.id===updated.id);
  if(idx>=0) state.orders[idx]=updated; else state.orders.push(updated);
  await storageSet(K_ORDERS, state.orders);

  const nowLost = updated.dealStage.startsWith('10.');
  if(nowLost && !wasLost){
    const exists = state.lostOrders.find(l=>l.clientName===updated.clientName && l.linkedOrderId===updated.id);
    if(!exists){
      state.lostOrders.push({
        id: uid(), linkedOrderId: updated.id, dateAnalysed: todayStr(),
        clientName: updated.clientName, projectName: updated.projectName,
        estimatedValue: updated.estimatedValue, competitorWhoWon:'', rootCause: updated.reasonLostWon||'',
        improvementsRequired:'', actionOwner:'', targetDate:'', status:'Not started', notes:[]
      });
      await storageSet(K_LOST, state.lostOrders);
    }
  }
  closeModal();
}

async function updateLost(id, field, value){
  const l = state.lostOrders.find(x=>x.id===id);
  if(!l) return;
  l[field]=value;
  if(field==='status' && value==='Implemented' && !l.completedDate) l.completedDate = todayStr();
  if(field==='status' && value!=='Implemented') l.completedDate = '';
  await storageSet(K_LOST, state.lostOrders);
  render();
}
async function addLostNote(id){
  const input = document.getElementById('l-note-'+id);
  const text = input.value.trim();
  if(!text) return;
  const l = state.lostOrders.find(x=>x.id===id);
  l.notes = l.notes||[];
  l.notes.push({date:todayStr(), by:state.currentUser.name, text});
  await storageSet(K_LOST, state.lostOrders);
  render();
}

function filteredOrdersFor(username){
  const orders = state.orders.filter(o=>o.salesPerson===username);

/* Aggregates the bottleneck-tracking data (follow-up on-time/delayed, action delay type,
   average days per stage, average total offer cycle time) across a set of orders. Kept separate
   from statsFor() so CEO-wide totals can be computed once over every rep's orders instead of
   averaging each rep's average (which would be wrong). */
function computeMasterStats(orders){
  let followUpOnTime=0, followUpDelayed=0, delayInternal=0, delayExternal=0, delayBoth=0;
  const stageDaySums = STAGES.map(_=>({sum:0,count:0}));
  let cycleDaySum=0, cycleDayCount=0;
  orders.forEach(o=>{
    (o.followUpHistory||[]).forEach(f=>{
      const d = daysBetween(f.targetDate, f.doneDate);
      if(d>0) followUpDelayed++; else followUpOnTime++;
    });
    (o.actionHistory||[]).forEach(a=>{
      if(a.delayType==='Internal') delayInternal++;
      else if(a.delayType==='External') delayExternal++;
      else if(a.delayType==='Both') delayBoth++;
    });
    (o.stageHistory||[]).forEach(s=>{
      const idx = STAGES.indexOf(s.stage);
      if(idx<0) return;
      if(s.stage.startsWith('9.')||s.stage.startsWith('10.')) return; // terminal stages are end markers, not durations
      const end = s.endDate || todayStr();
      const days = daysBetween(s.startDate, end);
      stageDaySums[idx].sum += days; stageDaySums[idx].count++;
    });
    if(o.dealStage.startsWith('9.')||o.dealStage.startsWith('10.')){
      cycleDaySum += totalCycleDays(o); cycleDayCount++;
    }
  });
  return {
    followUpOnTime, followUpDelayed, delayInternal, delayExternal, delayBoth,
    avgStageDays: stageDaySums.slice(0, OPEN_STAGES.length).map(x=>x.count?Math.round(x.sum/x.count):0),
    avgCycleDays: cycleDayCount?Math.round(cycleDaySum/cycleDayCount):0
  };
}

function statsFor(username){
  const filtered = filteredOrdersFor(username);
  const won = filtered.filter(o=>o.dealStage.startsWith('9.'));
  const lost = filtered.filter(o=>o.dealStage.startsWith('10.'));
  const open = filtered.filter(o=>!o.dealStage.startsWith('9.')&&!o.dealStage.startsWith('10.'));
  const winRate = (won.length+lost.length)>0 ? Math.round(won.length/(won.length+lost.length)*100) : 0;
  return {
    logged: filtered.length,
    pipelineValue: open.reduce((s,o)=>s+Number(o.estimatedValue||0),0),
    wonCount: won.length, wonValue: won.reduce((s,o)=>s+Number(o.estimatedValue||0),0),
    lostCount: lost.length, lostValue: lost.reduce((s,o)=>s+Number(o.estimatedValue||0),0),
    winRate,
    hot: filtered.filter(o=>o.priority==='Hot').length,
    warm: filtered.filter(o=>o.priority==='Warm').length,
    cold: filtered.filter(o=>o.priority==='Cold').length,
    stageCounts: STAGES.map(s=>filtered.filter(o=>o.dealStage===s).length),
    ...computeMasterStats(filtered)
  };
}

// ---- chart helpers: word-wrapped labels, a color palette that scales past 7
// categories, empty-state handling, and a small center-text plugin for doughnuts ----
function wrapChartLabel(str, max){
  max = max || 18;
  const clean = String(str||'').replace(/^\d+\.\s*/,'');
  const words = clean.split(' ');
  const lines = []; let cur = '';
  words.forEach(w=>{
    if((cur+' '+w).trim().length > max && cur){ lines.push(cur.trim()); cur = w; }
    else cur = (cur+' '+w).trim();
  });
  if(cur) lines.push(cur.trim());
  return lines;
}
const CHART_PALETTE = ['#1b3a6b','#a63a2f','#2f6b47','#a1650f','#5a2a82','#c4622d','#0f766e','#946b2d'];
function chartColors(n){
  if(n <= CHART_PALETTE.length) return CHART_PALETTE.slice(0,n);
  const out = [];
  for(let i=0;i<n;i++) out.push(`hsl(${Math.round(360*i/n)},50%,42%)`);
  return out;
}
function chartOrEmpty(el, hasData, buildFn){
  if(!el) return;
  const wrap = el.parentElement;
  const existing = wrap.querySelector('.chart-empty-msg');
  if(existing) existing.remove();
  el.style.display = hasData ? '' : 'none';
  if(!hasData){
    const msg = document.createElement('div');
    msg.className = 'chart-empty-msg';
    msg.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;';
    msg.textContent = 'No data yet';
    wrap.appendChild(msg);
    return;
  }
  buildFn();
}
function centerTextPlugin(label){
  return {
    id: 'centerText'+label,
    afterDraw(chart){
      const {ctx, chartArea} = chart;
      if(!chartArea) return;
      const total = chart.config.data.datasets[0].data.reduce((a,b)=>a+Number(b||0),0);
      const cx = (chartArea.left+chartArea.right)/2, cy = (chartArea.top+chartArea.bottom)/2;
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '700 19px Inter, sans-serif'; ctx.fillStyle = '#16232e';
      ctx.fillText(String(total), cx, cy-7);
      ctx.font = '600 9.5px Inter, sans-serif'; ctx.fillStyle = '#828d84';
      ctx.fillText(label.toUpperCase(), cx, cy+10);
      ctx.restore();
    }
  };
}
const donutLegend = {position:'bottom', labels:{boxWidth:9, padding:10, font:{size:11,family:'Inter'}}};

let charts = {};
function drawCharts(){
  const chartUsername = (state.currentUser.role==='ceo' && state.viewingAsRep) ? state.viewingAsRep : state.currentUser.username;

  const ordersToChart = filteredOrdersFor(chartUsername);
  const openForChart = ordersToChart.filter(o=>!o.dealStage.startsWith('9.')&&!o.dealStage.startsWith('10.'));
  const productValues = {};
  openForChart.forEach(o=>{
    const p = o.product||'Others';
    productValues[p] = (productValues[p]||0) + Number(o.estimatedValue||0);
  });
  const pLabels = Object.keys(productValues);
  const pData = Object.values(productValues);
  const pTotal = pData.reduce((a,b)=>a+b,0);

  const s = statsFor(chartUsername);

  const pEl = document.getElementById('chart-priority');
  const stEl = document.getElementById('chart-stage');
  const prodEl = document.getElementById('chart-product');
  const dEl = document.getElementById('chart-delaytype');
  const sdEl = document.getElementById('chart-stagedays');
  const wlEl = document.getElementById('chart-winloss');
  const rsEl = document.getElementById('chart-revstage');

  if(!pEl || !stEl || typeof Chart==='undefined') return;
  ['priority','stage','product','delaytype','stagedays','winloss','revstage'].forEach(k=>{ if(charts[k]) charts[k].destroy(); });

  // Priority mix — doughnut with a total-count center label and count+% on each slice
  chartOrEmpty(pEl, (s.hot+s.warm+s.cold)>0, ()=>{
    charts.priority = new Chart(pEl.getContext('2d'), {
      type:'doughnut',
      data:{labels:['Hot','Warm','Cold'], datasets:[{data:[s.hot,s.warm,s.cold], backgroundColor:['#a63a2f','#a1650f','#1b3a6b'], borderWidth:2, borderColor:'#fffffe'}]},
      options:{maintainAspectRatio:false, responsive:true, cutout:'68%',
        plugins:{
          legend: donutLegend,
          tooltip:{callbacks:{label(ctx){ const tot=ctx.dataset.data.reduce((a,b)=>a+b,0); const pct = tot?Math.round(ctx.parsed/tot*100):0; return ` ${ctx.label}: ${ctx.parsed} (${pct}%)`; }}},
          datalabels:{color:'#fff', font:{weight:'700',size:11}, formatter:(v)=> v>0 ? v : ''}
        }},
      plugins:[ChartDataLabels, centerTextPlugin('Offers')]
    });
  });

  // Pipeline by stage — horizontal bar, full (wrapped) stage names, count labels at bar end
  chartOrEmpty(stEl, s.stageCounts.reduce((a,b)=>a+b,0)>0, ()=>{
    charts.stage = new Chart(stEl.getContext('2d'), {
      type:'bar',
      data:{labels:STAGES.map(x=>wrapChartLabel(x,16)), datasets:[{data:s.stageCounts, backgroundColor:'#c4622d', borderRadius:3, maxBarThickness:18}]},
      options:{maintainAspectRatio:false, responsive:true, indexAxis:'y',
        plugins:{legend:{display:false}, tooltip:{callbacks:{title(items){ return STAGES[items[0].dataIndex]; }}},
          datalabels:{anchor:'end', align:'end', color:'#4b5a66', font:{size:10.5,weight:'600'}, formatter:(v)=> v>0? v : ''}},
        scales:{x:{ticks:{stepSize:1,precision:0}}, y:{ticks:{font:{size:10.5}}}}},
      plugins:[ChartDataLabels]
    });
  });

  // Pipeline Value by Product — doughnut, colors scale past 7 products, ₹ Cr + % in tooltip
  if(prodEl) chartOrEmpty(prodEl, pTotal>0, ()=>{
    charts.product = new Chart(prodEl.getContext('2d'), {
      type:'doughnut',
      data:{labels:pLabels, datasets:[{data:pData, backgroundColor:chartColors(pLabels.length), borderWidth:2, borderColor:'#fffffe'}]},
      options:{maintainAspectRatio:false, responsive:true, cutout:'62%',
        plugins:{
          legend: donutLegend,
          tooltip:{callbacks:{label(ctx){ const pct = pTotal?Math.round(ctx.parsed/pTotal*100):0; return ` ${ctx.label}: ${fmtCr(ctx.parsed)} (${pct}%)`; }}},
          datalabels:{color:'#fff', font:{weight:'700',size:10.5}, formatter:(v)=>{ const pct = pTotal?Math.round(v/pTotal*100):0; return pct>=6 ? pct+'%' : ''; }}
        }},
      plugins:[ChartDataLabels]
    });
  });

  // Action Delays by Type — doughnut with center total, matches priority mix styling
  if(dEl) chartOrEmpty(dEl, (s.delayInternal+s.delayExternal+s.delayBoth)>0, ()=>{
    charts.delaytype = new Chart(dEl.getContext('2d'), {
      type:'doughnut',
      data:{labels:['Internal','External','Both'], datasets:[{data:[s.delayInternal,s.delayExternal,s.delayBoth], backgroundColor:['#a1650f','#1b3a6b','#c4622d'], borderWidth:2, borderColor:'#fffffe'}]},
      options:{maintainAspectRatio:false, responsive:true, cutout:'68%',
        plugins:{
          legend: donutLegend,
          tooltip:{callbacks:{label(ctx){ const tot=ctx.dataset.data.reduce((a,b)=>a+b,0); const pct = tot?Math.round(ctx.parsed/tot*100):0; return ` ${ctx.label}: ${ctx.parsed} (${pct}%)`; }}},
          datalabels:{color:'#fff', font:{weight:'700',size:11}, formatter:(v)=> v>0 ? v : ''}
        }},
      plugins:[ChartDataLabels, centerTextPlugin('Delays')]
    });
  });

  // Average time per stage — horizontal bar, full labels, "X days" labels, bottleneck stage flagged in red
  if(sdEl) chartOrEmpty(sdEl, s.avgStageDays.reduce((a,b)=>a+b,0)>0, ()=>{
    const maxVal = Math.max(...s.avgStageDays);
    const barColors = s.avgStageDays.map(v => (v===maxVal && v>0) ? '#a63a2f' : '#1b3a6b');
    charts.stagedays = new Chart(sdEl.getContext('2d'), {
      type:'bar',
      data:{labels:OPEN_STAGES.map(x=>wrapChartLabel(x,20)), datasets:[{label:'Avg days', data:s.avgStageDays, backgroundColor:barColors, borderRadius:3, maxBarThickness:20}]},
      options:{maintainAspectRatio:false, responsive:true, indexAxis:'y',
        plugins:{legend:{display:false}, tooltip:{callbacks:{title(items){ return OPEN_STAGES[items[0].dataIndex]; }, label(ctx){ return ` ${ctx.parsed.x} day${ctx.parsed.x===1?'':'s'}${ctx.parsed.x===maxVal?' — longest stage':''}`; }}},
          datalabels:{anchor:'end', align:'end', color:'#4b5a66', font:{size:10.5,weight:'600'}, formatter:(v)=> v>0 ? v+'d' : ''}},
        scales:{x:{ticks:{stepSize:1,precision:0}, title:{display:true,text:'Average days',font:{size:10.5}}}, y:{ticks:{font:{size:10.5}}}}},
      plugins:[ChartDataLabels]
    });
  });

  // Win vs Loss — pie with center total and count+% labels
  if(wlEl) chartOrEmpty(wlEl, (s.wonCount+s.lostCount)>0, ()=>{
    charts.winloss = new Chart(wlEl.getContext('2d'), {
      type:'pie',
      data:{labels:['Won','Lost'], datasets:[{data:[s.wonCount, s.lostCount], backgroundColor:['#2f6b47','#a63a2f'], borderWidth:2, borderColor:'#fffffe'}]},
      options:{maintainAspectRatio:false, responsive:true,
        plugins:{
          legend: donutLegend,
          tooltip:{callbacks:{label(ctx){ const tot=ctx.dataset.data.reduce((a,b)=>a+b,0); const pct = tot?Math.round(ctx.parsed/tot*100):0; return ` ${ctx.label}: ${ctx.parsed} (${pct}%)`; }}},
          datalabels:{color:'#fff', font:{weight:'700',size:11}, formatter:(v)=> v>0 ? v : ''}
        }},
      plugins:[ChartDataLabels]
    });
  });

  // Revenue by Stage — horizontal bar, full labels, open stages in accent blue, Won green, Lost red
  if(rsEl){
    const revByStage = STAGES.map(stage => ordersToChart.filter(o => o.dealStage === stage).reduce((sum, o) => sum + Number(o.estimatedValue || 0), 0));
    chartOrEmpty(rsEl, revByStage.reduce((a,b)=>a+b,0)>0, ()=>{
      const revColors = STAGES.map(st => st.startsWith('9.') ? '#2f6b47' : st.startsWith('10.') ? '#a63a2f' : '#1b3a6b');
      charts.revstage = new Chart(rsEl.getContext('2d'), {
        type:'bar',
        data:{labels:STAGES.map(x=>wrapChartLabel(x,16)), datasets:[{label:'Value (CR)', data:revByStage, backgroundColor:revColors, borderRadius:3, maxBarThickness:18}]},
        options:{maintainAspectRatio:false, responsive:true, indexAxis:'y',
          plugins:{legend:{display:false}, tooltip:{callbacks:{title(items){ return STAGES[items[0].dataIndex]; }, label(ctx){ return ' '+fmtCr(ctx.parsed.x); }}},
            datalabels:{anchor:'end', align:'end', color:'#4b5a66', font:{size:10,weight:'600'}, formatter:(v)=> v>0 ? '₹'+v.toFixed(1)+'CR' : ''}},
          scales:{x:{beginAtZero:true, title:{display:true,text:'INR CR',font:{size:10.5}}}, y:{ticks:{font:{size:10.5}}}}},
        plugins:[ChartDataLabels]
      });
    });
  }
}
